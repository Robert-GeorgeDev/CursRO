<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --paper: #EDF1F5; --ink: #13203B; --ink-2: #4A5873; --accent: #5B3FA6; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 400px; }
  body { background: var(--paper) url("guilloche.svg") center / 100% 100% no-repeat; color: var(--ink); font-family: "Lora", Georgia, serif; padding: 0 72px; display: flex; align-items: center; justify-content: space-between; gap: 40px; }
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand img { width: 104px; height: 104px; }
  .word { font-size: 88px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .tag { margin-top: 18px; font-size: 25px; color: var(--ink-2); max-width: 38ch; line-height: 1.3; }
  .api { font-family: "Latin Modern Mono", "DejaVu Sans Mono", monospace; font-size: 24px; padding: 18px 22px; background: rgba(248,250,252,.9); border: 1px solid #C9D3E0; border-left: 6px solid var(--accent); border-radius: 4px; justify-self: start; }
</style>
</head>
<body>
  <div>
    <div class="brand"><img src="logo.svg" alt=""><div class="word">CursRO</div></div>
    <p class="tag">Every official BNR exchange rate since 2005. Free JSON and CSV API, updated daily.</p>
  </div>
  
  <div class="api">GET /CursRO/data/latest.json</div>
</body>
</html>
